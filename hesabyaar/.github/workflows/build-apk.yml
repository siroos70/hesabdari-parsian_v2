name: Build HesabYaar Iran APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Rust for Android
        uses: ./.github/actions/setup-rust-android

      - name: Prepare CI signing credentials
        shell: bash
        run: |
          if [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            P="$(openssl rand -hex 16)"
            echo "KEYSTORE_PASSWORD=$P" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$P" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=hesabyaar" >> "$GITHUB_ENV"
          else
            echo "KEY_ALIAS=${KEY_ALIAS:-hesabyaar}" >> "$GITHUB_ENV"
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Rust tests
        working-directory: rust
        run: cargo test -p hesabyar-core

      - name: Generate UniFFI bindings and Rust core
        run: ./gradlew :app:generateAndFixBindings :app:compileRustCore --no-daemon

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Create release keystore
        run: ./gradlew generateKeystore --no-daemon

      - name: Build release APK
        run: ./gradlew assembleRelease -PenableAbiSplits=false --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n1)"
          test -s "$APK"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)"
          "$BT/aapt2" dump badging "$APK" | head -n8
          "$BT/apksigner" verify --verbose "$APK"
          mkdir -p out
          cp "$APK" out/HesabYaar-Iran-v1.0.0-release.apk
          sha256sum out/HesabYaar-Iran-v1.0.0-release.apk > out/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HesabYaar-Iran-v1.0.0-release
          path: out/
          if-no-files-found: error
          retention-days: 30
