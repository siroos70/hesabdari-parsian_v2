name: CodSpeed Benchmarks

on:
  push:
    branches: [main]
  pull_request:
  # Allow running the benchmarks manually from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read # required for actions/checkout
  id-token: write # required for OIDC authentication with CodSpeed

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The CodSpeed JMH fork is vendored as a git submodule (with nested
          # submodules), so a recursive checkout is required.
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run benchmarks
        uses: CodSpeedHQ/action@f22792bfac16f3e14eb9fbea76f4a48e9cc22b93 # v4.19.1
        with:
          mode: walltime
          working-directory: benchmarks
          run: ./gradlew jmh
