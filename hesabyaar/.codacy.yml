# Codacy configuration
# https://docs.codacy.com/codacy-analysis-cli/#excluding-files-or-directories
exclude_paths:
  # AGENTS.md — agent guidance document, not source code. Exempt from generic
  # static analysis rules (file-size, empty-section, absolute-rule checks).
  - 'AGENTS.md'
  # UniFFI-generated Kotlin bindings — regenerated by Gradle, do not lint/fix by hand
  - '**/hesabyar_core.kt'
  - 'rust/uniffi/**'
  # Rust build output
  - 'rust/target/**'
  # Local Rust code-generator (build-time CLI, not a runtime security surface)
  - 'rust/uniffi-gen/**'
